[package]
name = "websocket-tcp-example"
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "websocket-tcp-server"
path = "src/main.rs"

[[bin]]
name = "websocket-tcp-client"
path = "src/client.rs"

[dependencies]
actix-codec.workspace = true
actix-files.workspace = true
actix-web.workspace = true
actix-ws.workspace = true

byteorder = "1.2"
color-eyre.workspace = true
err-report.workspace = true
examples-common.workspace = true
eyre.workspace = true
futures-util = { workspace = true, features = ["sink"] }
ractor = { version = "0.16", default-features = false, features = ["tokio_runtime"] }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = "0.1.8"
tokio-util = { workspace = true, features = ["codec", "rt", "time"] }
tracing.workspace = true
