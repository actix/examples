[package]
name = "websocket-example"
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "websocket-chat-server"
path = "src/main.rs"

[dependencies]
actix-files.workspace = true
actix-web.workspace = true
actix-ws.workspace = true
futures-util.workspace = true
ractor = { version = "0.16", default-features = false, features = ["tokio_runtime"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }

tokio-util = { workspace = true, features = ["rt", "time"] }
color-eyre.workspace = true
eyre.workspace = true
examples-common.workspace = true

tracing.workspace = true
rand.workspace = true
