name: lint

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  zizmor:
    name: zizmor
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          advanced-security: false
          annotations: true
          version: v1.32.0

  fmt:
    name: rustfmt check
    permissions:
      contents: read
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          components: rustfmt

      - name: rustfmt
        uses: actions-rust-lang/rustfmt@v1.1.2

  clippy:
    name: clippy check
    permissions:
      contents: read
    runs-on: ubuntu-latest

    env:
      CI: 1
      CARGO_INCREMENTAL: false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: stable
          components: clippy

      - name: clippy
        timeout-minutes: 30
        run: cargo clippy --workspace --all-features --tests -- -D warnings
