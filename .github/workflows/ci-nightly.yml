name: CI (nightly)

on:
  # Temporary: validate nightly CI on pull requests during the Nix migration.
  pull_request:
    types: [opened, synchronize, reopened]
  schedule: [cron: "40 1 * * *"]
  workflow_dispatch:

jobs:
  build_and_test:
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        version: [nightly]

    name: ${{ matrix.version }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (${{ matrix.version }})
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: ${{ matrix.version }}

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Enter Nix devshell
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: .#ci

      - name: Create Test DBs
        run: just init-db

      - name: Start Redis
        run: just start-redis

      - name: cargo check
        run: just cargo-check
        timeout-minutes: 30

      - name: cargo test
        run: just test
        timeout-minutes: 30

      - name: cargo test (diesel)
        run: just test-diesel
        timeout-minutes: 10

      - name: Install cargo-ci-cache-clean
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-ci-cache-clean

      - name: CI cache clean
        run: just ci-cache-clean
